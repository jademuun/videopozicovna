networks:
  media-network:
    name: media-network

volumes:
  gluetun-port:
  clamav-db:

services:
  # Media Player and Streamer
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${DATA_ROOT}/media:/data/media
    ports:
      - 8096:8096
    restart: unless-stopped
    networks:
      - media-network

  # Torrent Indexer (Search)
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    networks:
      - media-network

  # Movie Manager
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - 7878:7878
    restart: unless-stopped
    networks:
      - media-network

  # TV Show Manager
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - 8989:8989
    restart: unless-stopped
    networks:
      - media-network

  # Subtitle Manager
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${DATA_ROOT}/media:/data/media
    ports:
      - 6767:6767
    restart: unless-stopped
    networks:
      - media-network

  # VPN Gateway for Transmission (ProtonVPN via WireGuard)
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTONVPN_WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${PROTONVPN_WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${PROTONVPN_SERVER_COUNTRY}
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      - TZ=${TZ}
    ports:
      - 9091:9091
    volumes:
      - gluetun-port:/tmp/gluetun
    restart: unless-stopped
    networks:
      - media-network
  # Downloader (Transmission) - all network traffic routed through gluetun
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    depends_on:
      - gluetun
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - USER=${TRANSMISSION_USER}
      - PASS=${TRANSMISSION_PASS}
    volumes:
      - ${CONFIG_ROOT}/transmission:/config
      - ${DATA_ROOT}:/data
      - ${DATA_ROOT}/watch:/watch
    restart: unless-stopped

  # Watches Gluetun's forwarded port and pushes it into Transmission automatically
  port-sync:
    image: curlimages/curl:latest
    container_name: port-sync
    depends_on:
      - gluetun
      - transmission
    network_mode: "service:gluetun"
    environment:
      - TRANSMISSION_USER=${TRANSMISSION_USER}
      - TRANSMISSION_PASS=${TRANSMISSION_PASS}
    volumes:
      - gluetun-port:/tmp/gluetun:ro
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        last=""
        while true; do
          port=$$(cat /tmp/gluetun/forwarded_port 2>/dev/null)
          if [ -n "$$port" ] && [ "$$port" != "$$last" ]; then
            sid=$$(curl -s -D - -o /dev/null -u "$$TRANSMISSION_USER:$$TRANSMISSION_PASS" http://127.0.0.1:9091/transmission/rpc | grep -i X-Transmission-Session-Id | tr -d '\r' | awk '{print $$2}')
            curl -s -u "$$TRANSMISSION_USER:$$TRANSMISSION_PASS" -H "X-Transmission-Session-Id: $$sid" -d "{\"method\":\"session-set\",\"arguments\":{\"peer-port\":$$port}}" http://127.0.0.1:9091/transmission/rpc > /dev/null \
              && echo "Synced Transmission peer-port to $$port" \
              && last="$$port"
          fi
          sleep 30
        done

  # Scans downloaded media for malware/viruses on a daily schedule
  clamav:
    image: clamav/clamav:latest
    container_name: clamav
    environment:
      - TZ=${TZ}
    volumes:
      - ${DATA_ROOT}:/data:ro
      - clamav-db:/var/lib/clamav
      - ${CONFIG_ROOT}/clamav/logs:/var/log/clamav
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /var/log/clamav
        while true; do
          echo "[$$(date)] Updating virus definitions..."
          freshclam --stdout || echo "freshclam update failed, scanning with existing definitions"
          echo "[$$(date)] Scanning files modified in the last 24h..."
          find /data -type f -mtime -1 -print0 | xargs -0 --no-run-if-empty clamscan -i --log=/var/log/clamav/scan.log
          echo "[$$(date)] Scan complete. Sleeping 24h..."
          sleep 86400
        done

  # Cloudflare Bypass for Prowlarr
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    restart: unless-stopped
    networks:
      - media-network
